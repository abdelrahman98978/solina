name: Solina Motors ERP — Quality & Compliance Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: TypeScript, Lint, Unit Tests & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solina

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: solina/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Check (tsc -b)
        run: npx tsc -b

      - name: Static Analysis & Linter (oxlint)
        run: npm run lint

      - name: Financial, ZATCA & ERP Core Unit Tests
        run: npm test

      - name: Production Bundle Build
        run: npm run build
